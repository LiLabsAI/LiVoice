appId: com.aliahad.wovoice.desktop
productName: LiVoice
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: native/tapd
    to: tapd
  - from: native/contextd
    to: contextd
protocols:
  - name: LiVoice
    schemes: [wovoice, livoice]
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  target:
    - target: dmg
    - target: dir
  extendInfo:
    NSMicrophoneUsageDescription: LiVoice needs microphone access to convert your speech into text.
    NSAppleEventsUsageDescription: LiVoice sends a paste keystroke to the app you are using to insert your dictated text.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: livoice-desktop-${version}.${ext}
npmRebuild: false
