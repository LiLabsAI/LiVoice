<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Return to LiVoice</title>
    <link rel="icon" href="/media/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app/callback.js" defer></script>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true"></span>LiVoice</div>
      <section class="card">
        <h1 id="callback-title">Return to LiVoice</h1>
        <p class="lead" id="callback-message">Your email is verified. LiVoice should open automatically.</p>
        <div class="actions">
          <a class="button" id="open-app" href="#">Open LiVoice on Android</a>
          <a class="button hidden" id="open-desktop" href="#">Open in LiVoice for Mac</a>
        </div>
        <p class="note" id="callback-help">If the app stays closed, tap the button now to finish secure sign-in.</p>
      </section>
    </main>
  </body>
</html>
