name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'contracts/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'contracts/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Check Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | python3 -c 'import re,sys; version=tuple(map(int,re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()).groups())); assert version >= (6,2), "LiVoice requires Xcode 26 / Swift 6.2 or newer"'
      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Test shared policies and storage
        run: swift test --package-path ios/Core
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Test app and extensions in simulator
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -quiet -project WoVoice.xcodeproj -scheme WoVoice \
            -sdk iphonesimulator -destination "id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath /tmp/WoVoiceTests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
      - name: Compile production device targets
        working-directory: ios
        run: |
          xcodebuild -quiet -project WoVoice.xcodeproj -scheme WoVoice \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-results
          path: /tmp/WoVoiceTests.xcresult
