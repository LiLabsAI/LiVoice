name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches the daemon JVM pinned in gradle/gradle-daemon-jvm.properties.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # :shared holds the vault-crypto/PKCE/sync tests — never skip it.
      - run: ./gradlew :app:testDebugUnitTest :shared:test :app:lintDebug assembleDebug :app:compileDebugAndroidTestKotlin

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  desktop-native:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - run: npm run build:native
      - name: Verify universal Mach-O binaries
        run: |
          set -euo pipefail
          for helper in native/tapd native/contextd; do
            test -x "$helper"
            info=$(file "$helper")
            printf '%s\n' "$info"
            echo "$info" | grep -q "arm64"
            echo "$info" | grep -q "x86_64"
          done

  marketing-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing-video
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-video/package-lock.json
      - run: npm ci
      - run: npm run lint
