name: ShortcutProbe
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
targets:
  ShortcutProbe:
    type: application
    platform: iOS
    sources: [Probe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliahad.wovoice.shortcutprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WoVoiceProbe
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  ShortcutProbe:
    build:
      targets:
        ShortcutProbe: all
