name: WoVoice
options:
  bundleIdPrefix: com.aliahad.wovoice
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.2'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    'CODE_SIGN_STYLE[sdk=iphonesimulator*]': Manual
    TARGETED_DEVICE_FAMILY: '1,2'
    WOVOICE_APP_GROUP: group.com.aliahad.wovoice.ios
packages:
  WoVoiceCore:
    path: Core
targets:
  WoVoice:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliahad.wovoice.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WoVoice.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WoVoiceCore
      - target: WoVoiceKeyboard
        embed: true
      - target: WoVoiceWidgets
        embed: true
  WoVoiceWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliahad.wovoice.ios.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/WoVoiceKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: WoVoiceCore
  WoVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliahad.wovoice.ios.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/WoVoiceKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: WoVoiceCore
  WoVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliahad.wovoice.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WoVoice
      - package: WoVoiceCore
schemes:
  WoVoice:
    build:
      targets:
        WoVoice: all
        WoVoiceKeyboard: all
    run:
      config: Debug
    test:
      targets: [WoVoiceTests]
